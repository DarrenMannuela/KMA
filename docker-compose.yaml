# Logs rotate: 5 files of 10 MB per container, so months of running never
# fill the disk (Docker's default keeps every line forever).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  sqlite-db:
    # Not a database server — SQLite is a file the backend opens itself.
    # This container only keeps a sqlite3 shell handy for looking at the
    # data by hand: docker exec -it kma_sqlite_server sqlite3 kma.sqlite
    build: ./backup
    image: kma-sqlite-tools
    container_name: kma_sqlite_server
    restart: unless-stopped
    # Without an init, `tail` as PID 1 ignores Docker's stop signal and
    # every stop waited 10s and then killed it (exit 137).
    init: true
    volumes:
      - ./db_data:/db
    working_dir: /db
    stdin_open: true
    tty: true
    command: sh -c "touch /db/kma.sqlite && exec tail -f /dev/null"
    logging: *logging
    networks:
      - kma_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kma_backend
    restart: unless-stopped
    # NOT published to the host — nginx reaches this container over
    # the internal kma_network via its container name, so the browser
    # never talks to :8000 directly (same reasoning as the auth
    # service's compose file). Uncomment only for local debugging.
    # ports:
    #   - "8000:8000"
    volumes:
      - ./db_data:/app/db_data
      # Client-item photos. They used to be written inside the container
      # only, where the next rebuild would have deleted them; here they
      # live in ./uploads next to the database, and the backup takes them.
      - ./uploads:/app/uploads
    depends_on:
      - sqlite-db
    env_file:
      - ./.env
    # The backend finishes the requests in progress when it's stopped
    # (see cmd/server/main.go); this is how long Docker waits for that.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/v1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging
    networks:
      - kma_network

  backup:
    build: ./backup
    image: kma-sqlite-tools
    container_name: kma_backup
    restart: unless-stopped
    # Alpine's busybox crond forks a child per job and that child calls
    # setpgid() on itself — which fails with "Operation not permitted"
    # when crond is running as the container's PID 1 (no real init
    # process ever reaps/owns process groups the way a normal init
    # would). That failure was killing crond immediately after start,
    # which crashed this container's whole command and put it in a
    # restart loop — taking a fresh ad-hoc backup on every restart
    # instead of on the crontab's actual schedule. `init: true` gives the container
    # a proper PID 1 (Docker's built-in tini) so crond runs as a normal
    # child process instead.
    init: true
    volumes:
      # Read-write, though the backup only reads: once the backend has
      # stopped cleanly, SQLite has folded its -wal/-shm files away, and
      # opening a WAL database then needs to create them again, which a
      # read-only mount can't. With :ro, no backup could be taken while
      # the backend was down.
      - ./db_data:/db
      - ./uploads:/uploads:ro
      - ./backups:/backups
      # A second copy of every backup, off this disk if you can: set
      # BACKUP_COPY_DIR in .env to an external drive or a synced folder
      # (iCloud Drive, Google Drive). Empty: no copy (this then just
      # mounts ./backups a second time, unused).
      - ${BACKUP_COPY_DIR:-./backups}:/backups-copy
      # Scripts mounted :ro on purpose: this container should never be
      # able to modify the script that runs against the DB.
      - ./backup/backup.sh:/backup.sh:ro
      - ./backup/crontab:/etc/crontabs/root:ro
    environment:
      TZ: Asia/Jakarta
      UPLOADS_DIR: /uploads
      # How many backups to keep (of the database and of the photos,
      # each), and how often to take one.
      BACKUP_KEEP: "8"
      BACKUP_EVERY_DAYS: "7"
      BACKUP_COPY: ${BACKUP_COPY_DIR:+on}
    # backup.sh is invoked via `sh backup.sh` rather than executed
    # directly, so it never needs its executable bit set (a chmod on the
    # read-only mount would fail). On start: save the settings for cron
    # (cron jobs get an empty environment), take a backup if one is due,
    # then hand over to cron, which checks every hour. A failed backup
    # doesn't stop the container: cron tries again within the hour.
    command: sh -c "export -p > /run/backup.env; sh /backup.sh due; exec crond -f -l 2"
    # Shows as unhealthy in Docker Desktop when the newest good backup is
    # more than 8 days old.
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'kma-[0-9]*.sqlite.gz' -mtime -8 | grep -q ."]
      interval: 10m
      timeout: 10s
      start_period: 2m
    logging: *logging
    networks:
      - kma_network

networks:
  kma_network:
    name: kma_network
