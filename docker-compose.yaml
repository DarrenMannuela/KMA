services:
  sqlite-db:
    image: alpine:latest
    container_name: kma_sqlite_server
    restart: unless-stopped
    volumes:
      - ./db_data:/db
    working_dir: /db
    stdin_open: true
    tty: true
    command: >
      /bin/sh -c "
      apk add --no-cache sqlite &&
      touch /db/kma.sqlite &&
      tail -f /dev/null"
    networks:
      - kma_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kma_backend
    restart: unless-stopped
    # NOT published to the host — nginx reaches this container over
    # the internal kma_network via its container name, so the browser
    # never talks to :8000 directly (same reasoning as the auth
    # service's compose file). Uncomment only for local debugging.
    # ports:
    #   - "8000:8000"
    volumes:
      - ./db_data:/app/db_data
    depends_on:
      - sqlite-db
    env_file:
      - ./.env
    networks:
      - kma_network

  backup:
    image: alpine:latest
    container_name: kma_backup
    restart: unless-stopped
    # Read-only mount for the source DB — this container only ever backs
    # up, it should never be able to write into db_data even by accident.
    volumes:
      - ./db_data:/db:ro
      - ./backups:/backups
      - ./backup/backup.sh:/backup.sh:ro
      - ./backup/crontab:/etc/crontabs/root:ro
    environment:
      # Override to change how many days of backups to keep, e.g.
      # BACKUP_RETENTION_DAYS=90 for ~3 months.
      BACKUP_RETENTION_DAYS: "30"
    command: >
      /bin/sh -c "
      apk add --no-cache sqlite dcron &&
      chmod +x /backup.sh &&
      /backup.sh &&
      crond -f -l 2"
    networks:
      - kma_network

networks:
  kma_network:
    name: kma_network